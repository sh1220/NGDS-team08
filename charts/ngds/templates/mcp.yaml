apiVersion: v1
kind: Service
metadata:
  name: mcp
  labels: {{- include "so.labels" "mcp" | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: mcp}
  ports:
    - {name: http, port: {{ .Values.mcp.port }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels: {{- include "so.labels" "mcp" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mcp}
  template:
    metadata:
      labels: {{- include "so.labels" "mcp" | nindent 8 }}
    spec:
      {{- include "so.podSecurity" 10001 | nindent 6 }}
      containers:
        - name: mcp
          image: {{ .Values.mcp.image }}
          imagePullPolicy: IfNotPresent
          {{- include "so.containerSecurity" . | nindent 10 }}
          args: ["--transport", "http", "--host", "0.0.0.0", "--port", "{{ .Values.mcp.port }}"]
          env:
            - {name: PROMETHEUS_URL, value: {{ .Values.mcp.prometheusUrl | quote }}}
            - {name: LOKI_URL, value: {{ .Values.mcp.lokiUrl | quote }}}
            - {name: NEO4J_URI, value: "bolt://neo4j:7687"}
            - {name: NEO4J_USER, value: neo4j}
            - {name: NEO4J_PASSWORD, value: {{ .Values.neo4j.password | quote }}}
            - {name: TARGET_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: TARGET_POD, value: "postgres-.*"}
            - {name: DATA_MOUNTPOINT, value: {{ .Values.postgres.nodeMountpoint | quote }}}
          ports:
            - {name: http, containerPort: {{ .Values.mcp.port }}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.mcp.resources | nindent 12 }}
