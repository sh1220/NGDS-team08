{{- if .Values.nodeExporter.enabled }}
# node layer: node-exporter
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  labels: {{- include "so.labels" "node-exporter" | nindent 4 }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: node-exporter}
  template:
    metadata:
      labels: {{- include "so.labels" "node-exporter" | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: {{ .Values.nodeExporter.image }}
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=:9100
          ports:
            - {name: metrics, containerPort: 9100}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 200m, memory: 64Mi}
          volumeMounts:
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
            - {name: root, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer}
      volumes:
        - {name: proc, hostPath: {path: /proc}}
        - {name: sys, hostPath: {path: /sys}}
        - {name: root, hostPath: {path: /}}
---
{{- end }}
{{- if .Values.kubeStateMetrics.enabled }}
# kubernetes layer: kube-state-metrics
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  # ClusterRole·바인딩은 클러스터 전역이라 관리자가 cluster/namespace-rbac.yaml로 만든다 (ngds-kube-state-metrics)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels: {{- include "so.labels" "kube-state-metrics" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {{- include "so.labels" "kube-state-metrics" | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: {{ .Values.kubeStateMetrics.image }}
          args: ["--resources=pods,nodes,deployments,statefulsets,daemonsets"]
          ports:
            - {name: metrics, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
{{- end }}
