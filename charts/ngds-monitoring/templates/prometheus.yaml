{{- define "so.prometheus.config" }}
global:
  scrape_interval: {{ .Values.prometheus.scrapeInterval }}
  evaluation_interval: {{ .Values.prometheus.scrapeInterval }}
scrape_configs:
  # annotation 붙은 파드. 수집기 네임스페이스(node-exporter, kube-state-metrics)는 메트릭 안의 namespace/pod 라벨을 믿는다(honor_labels).
  # 앱 네임스페이스(postgres_exporter)는 팀원이 파드를 만들 수 있으므로 라벨을 덮어써 다른 대상인 척 못 하게 한다.
{{- range $ns, $honor := dict .Release.Namespace true .Values.targetNamespace false }}
  - job_name: pods-{{ $ns }}
    honor_labels: {{ $honor }}
    kubernetes_sd_configs:
      - role: pod
        namespaces: {names: [{{ $ns }}]}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_phase]
        action: drop
        regex: (Succeeded|Failed)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: job
{{- end }}
  # kubelet (PVC volume stats) and cAdvisor (container layer): 노드 kubelet(:10250)에 직접 붙는다.
  # API 서버 프록시(nodes/proxy)는 kubelet exec까지 열리는 넓은 권한이라 쓰지 않는다 → nodes/metrics만 필요.
  # kubelet 서빙 인증서는 노드별 자체 서명이라 검증을 끈다(클러스터 내부 경로). 보내는 토큰은 조회 전용(nodes/metrics, 파드 목록).
  # ponytail: 검증 생략 — kubelet serverTLSBootstrap(클러스터 CA 서명)으로 바꾸면 ca_file로 검증 가능 (홈랩 ④에서)
{{- range $job, $path := dict "kubelet" "metrics" "cadvisor" "metrics/cadvisor" }}
  - job_name: {{ $job }}
    scheme: https
    tls_config:
      insecure_skip_verify: true
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    metrics_path: /{{ $path }}
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
{{- end }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-prometheus
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Name }}-prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: {{ .Release.Namespace }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    {{- include "so.prometheus.config" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {{- include "so.labels" "prometheus" | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: prometheus}
  ports:
    - {name: http, port: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- include "so.labels" "prometheus" | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {{- include "so.labels" "prometheus" | nindent 8 }}
      annotations:
        checksum/config: {{ include "so.prometheus.config" . | sha256sum | trunc 12 }}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          resources: {{- toYaml .Values.prometheus.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
