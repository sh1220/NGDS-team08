{{- define "so.loki.config" }}
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
limits_config:
  retention_period: {{ .Values.loki.retention }}
  reject_old_samples: true
  reject_old_samples_max_age: 1h
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
analytics:
  reporting_enabled: false
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki.yaml: |
    {{- include "so.loki.config" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: {{- include "so.labels" "loki" | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: loki}
  ports:
    - {name: http, port: 3100}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: {{- include "so.labels" "loki" | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: loki}
  template:
    metadata:
      labels: {{- include "so.labels" "loki" | nindent 8 }}
      annotations:
        checksum/config: {{ include "so.loki.config" . | sha256sum | trunc 12 }}
    spec:
      securityContext: {runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          args: ["-config.file=/etc/loki/loki.yaml", "-target=all"]
          ports:
            - {name: http, containerPort: 3100}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
          resources: {{- toYaml .Values.loki.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          emptyDir: {}
