layer: kubernetes
metrics:
  pod_restarts:
    name: Container restarts in window
    unit: count
    promql: |
      sum by (pod, container) (increase(kube_pod_container_status_restarts_total{namespace="{namespace}",pod=~"{pod}",container="{container}"}[{window}]))
  pod_last_terminated_oom:
    name: Last termination reason is OOMKilled (1 = yes)
    unit: bool
    promql: |
      max by (pod, container) (kube_pod_container_status_last_terminated_reason{namespace="{namespace}",pod=~"{pod}",container="{container}",reason="OOMKilled"})
  pod_last_terminated_reason:
    name: Last termination reason (any)
    unit: bool
    promql: |
      max by (pod, container, reason) (kube_pod_container_status_last_terminated_reason{namespace="{namespace}",pod=~"{pod}"}) > 0
  pod_not_ready:
    name: Pods not ready
    unit: count
    promql: |
      sum(kube_pod_status_ready{namespace="{namespace}",pod=~"{pod}",condition="false"})
  node_disk_pressure:
    name: Node DiskPressure condition (1 = true)
    unit: bool
    promql: |
      max by (node) (kube_node_status_condition{condition="DiskPressure",status="true"})
  pvc_avail_ratio:
    name: Postgres PVC available bytes ratio (kubelet volume stats)
    unit: ratio
    promql: |
      kubelet_volume_stats_available_bytes{namespace="{namespace}",persistentvolumeclaim=~"data-{pod}"}
      / kubelet_volume_stats_capacity_bytes{namespace="{namespace}",persistentvolumeclaim=~"data-{pod}"}
  pvc_inodes_free_ratio:
    name: Postgres PVC free inode ratio (kubelet volume stats)
    unit: ratio
    promql: |
      kubelet_volume_stats_inodes_free{namespace="{namespace}",persistentvolumeclaim=~"data-{pod}"}
      / kubelet_volume_stats_inodes{namespace="{namespace}",persistentvolumeclaim=~"data-{pod}"}
