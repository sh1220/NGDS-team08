# 클러스터 관리자가 적용한다: make cluster-init (재적용 가능)
#   ngds            앱(postgres, neo4j, mcp). Pod Security restricted. 팀원(ngds-devs)이 배포·exec·장애 주입, 앱 러너(ngds-ci)가 CI 배포
#   ngds-monitoring 수집기(Prometheus, Loki, promtail, node-exporter, kube-state-metrics). hostPath·hostNetwork가 필요해 privileged.
#                   여기에 파드를 만들 수 있으면 노드 root와 같다 → 팀원·앱 러너는 조회만. 배포는 monitoring.yml(main + 관리자 승인)
apiVersion: v1
kind: Namespace
metadata:
  name: ngds
  labels:
    # 특권 파드·hostPath·root 실행을 거부한다(노드 탈취 방지). 차트의 파드는 restricted 기준을 맞춘다
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: ngds-monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ngds-dev
  namespace: ngds
rules:
  # 앱 배포 (helm upgrade --install / uninstall), 장애 주입(helm --reuse-values로 limit 변경)
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # helm은 릴리스 기록을 이 네임스페이스의 Secret에 저장한다
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  # 디버깅·장애 주입: 부하 파드 생성(kubectl run), 로그·exec·port-forward, 이벤트
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/log, events, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ngds-devs
  namespace: ngds
subjects:
  - {kind: Group, name: ngds-devs, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: Role, name: ngds-dev, apiGroup: rbac.authorization.k8s.io}
---
# 수집기 네임스페이스는 조회만. port-forward는 주지 않는다: hostNetwork 파드(node-exporter)로 포워딩하면 노드의 localhost 포트에 닿는다.
# 대신 Prometheus·Loki Service에만 API 서버 프록시(services/proxy)를 연다 → make pf 의 kubectl proxy 경로
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ngds-monitoring-view
  namespace: ngds-monitoring
rules:
  - apiGroups: ["", "apps"]
    resources: [pods, pods/log, services, endpoints, events, configmaps, deployments, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["prometheus:9090", "loki:3100"]  # 프록시 경로의 <서비스>:<포트> 그대로 매칭된다
    verbs: [get]  # GET 조회만 (POST면 Loki 로그 주입·삭제 API까지 열린다). MCP 클라이언트도 GET만 쓴다
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ngds-devs
  namespace: ngds-monitoring
subjects:
  - {kind: Group, name: ngds-devs, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: Role, name: ngds-monitoring-view, apiGroup: rbac.authorization.k8s.io}
---
# CI 러너(LXC 112) 전용: 차트가 만드는 리소스와 helm 릴리스 Secret만. exec·port-forward·파드 생성 없음.
# 팀원 권한과 따로 회수할 수 있다: kubectl delete rolebinding -n ngds ngds-ci
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ngds-ci
  namespace: ngds
rules:
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events, persistentvolumeclaims]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ngds-ci
  namespace: ngds
subjects:
  - {kind: Group, name: ngds-ci, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: Role, name: ngds-ci, apiGroup: rbac.authorization.k8s.io}
---
# ---- 수집기 배포 (NGDS 레포 .github/workflows/monitoring.yml, Environment "monitoring" 승인 후) ----
# 그룹 ngds-monitoring-ci 인증서는 러너 디스크가 아니라 GitHub Environment secret에만 있다 (cluster/runner-setup.sh가 갱신).
# privileged 네임스페이스라 이 권한 = 노드 root와 같다 → main 브랜치 + 관리자 승인을 거친 job만 받는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ngds-monitoring-ci
  namespace: ngds-monitoring
rules:
  - apiGroups: ["apps"]
    resources: [deployments, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps, secrets, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ngds-monitoring-ci
  namespace: ngds-monitoring
subjects:
  - {kind: Group, name: ngds-monitoring-ci, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: Role, name: ngds-monitoring-ci, apiGroup: rbac.authorization.k8s.io}
---
# 수집기 ServiceAccount의 클러스터 전역 조회 권한 (차트가 아니라 여기서: 배포 주체가 ClusterRole을 못 만들게)
# Prometheus: 파드·서비스 발견 + kubelet 지표. nodes/proxy는 kubelet exec까지 열려 주지 않는다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ngds-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ngds-prometheus
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ngds-prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: ngds-monitoring}
---
# kube-state-metrics: --resources 에 넣은 것만 (Secret 제외)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ngds-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ngds-kube-state-metrics
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ngds-kube-state-metrics}
subjects:
  - {kind: ServiceAccount, name: kube-state-metrics, namespace: ngds-monitoring}
---
# ---- 조회 전용 팀원 (그룹 ngds-viewers): 밖에서 Cloudflare Access TCP(k8s.sh1220.com)로 붙는 kubeconfig용 ----
# 두 네임스페이스에 같은 조회 규칙. ClusterRole로 정의하되 RoleBinding으로만 묶으므로 각 네임스페이스 안에서만 유효하다.
# Secret(helm 릴리스 값·비밀번호 포함)·ServiceAccount 토큰·exec·port-forward·쓰기 없음
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ngds-view
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, replicasets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ngds-viewers
  namespace: ngds
subjects:
  - {kind: Group, name: ngds-viewers, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: ClusterRole, name: ngds-view, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ngds-viewers-view
  namespace: ngds-monitoring
subjects:
  - {kind: Group, name: ngds-viewers, apiGroup: rbac.authorization.k8s.io}
  - {kind: Group, name: ngds-devs, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: ClusterRole, name: ngds-view, apiGroup: rbac.authorization.k8s.io}
---
# 수집기 네임스페이스: 위 조회 + Prometheus·Loki Service 프록시 GET (ngds-monitoring-view)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ngds-viewers
  namespace: ngds-monitoring
subjects:
  - {kind: Group, name: ngds-viewers, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: Role, name: ngds-monitoring-view, apiGroup: rbac.authorization.k8s.io}
