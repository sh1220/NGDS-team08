# 수집기(charts/ngds-monitoring) 배포. ngds-monitoring은 privileged 네임스페이스라 배포 권한 = 노드 root와 같다.
#   → kubeconfig(그룹 ngds-monitoring-ci)는 러너 디스크가 아니라 Environment "monitoring"의 secret에만 둔다.
#     Environment 규칙: main 브랜치만 + 관리자(sh1220) 승인. 브랜치에 워크플로를 push해도 이 secret은 받지 못한다.
#   ClusterRole 등 클러스터 전역 리소스는 여기서 만들지 않는다 (관리자 make cluster-init)
name: monitoring
on:
  push:
    branches: [main]
    paths: ["charts/ngds-monitoring/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, ngds]
    environment: monitoring
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: helm upgrade ngds-monitoring
        env:
          KUBECONFIG_DATA: ${{ secrets.MONITORING_KUBECONFIG }}
        run: |
          # 이 job 동안만 디스크에 두고 지운다
          export KUBECONFIG="$RUNNER_TEMP/monitoring-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          (umask 077; printf '%s\n' "$KUBECONFIG_DATA" > "$KUBECONFIG")
          helm upgrade --install ngds-monitoring charts/ngds-monitoring -n ngds-monitoring --wait --timeout 10m
          kubectl -n ngds-monitoring get pods -o wide
          echo "## 수집기 배포 ✅ \`${GITHUB_SHA::7}\` (승인: Environment monitoring)" >> "$GITHUB_STEP_SUMMARY"
