# PR 검사: GitHub 호스팅 러너에서만 돈다 (홈랩 러너는 main 배포 전용)
name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m py_compile app/*.py
      - uses: azure/setup-helm@v4
      - run: helm lint charts/chabunsi && helm template chabunsi charts/chabunsi --set serviceMonitor.enabled=true >/dev/null
      - run: docker build -t chabunsi:ci .
