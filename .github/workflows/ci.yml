# PR 검사: GitHub 호스팅 러너에서만 돈다 (홈랩 러너는 main 배포 전용)
name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 -m py_compile src/*.py scripts/seed_kg.py
      - run: bash -n scripts/faults/*.sh
      - uses: azure/setup-helm@v4
      - run: |
          helm lint charts/ngds charts/ngds-monitoring
          helm template ngds charts/ngds -n ngds >/dev/null
          helm template ngds-monitoring charts/ngds-monitoring -n ngds-monitoring >/dev/null
      - run: docker build -t ngds-team08-mcp:ci .
